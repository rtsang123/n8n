<!doctype html>
<!--
  This hidden file tells Netlify to collect your leads.
  Do not delete it. Leads appear in your Netlify dashboard under "Forms".
-->
<html lang="en">
	<head><meta charset="utf-8" /><title>Forms</title></head>
	<body>
		<form name="leads" netlify netlify-honeypot="bot-field" hidden>
			<input type="text" name="name" />
			<input type="email" name="email" />
			<input type="text" name="assessment" />
			<input type="text" name="score" />
			<input type="text" name="bot-field" />
		</form>
	</body>
</html>
